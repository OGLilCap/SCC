    <script>
        // Surface any script error directly on the page — helpful for
        // debugging on a phone (via NFC tap) where dev tools aren't available.
        window.addEventListener('error', (e) => {
            const factEl = document.getElementById('fact');
            const loadingEl = document.getElementById('loading');
            if (loadingEl) loadingEl.style.display = 'none';
            if (factEl) factEl.innerHTML = `<strong>Something went wrong loading this page.</strong><br><small>${e.message}</small>`;

        // ------------------------------------------------------------------
        // ST. CHARLES COUNTY FACTS — provided by the client (366 entries,
        // covering every day of the year including Feb. 29 for leap years).
        //
        // Key format: "M-D" (month-day, NO leading zeros) e.g. "1-1", "8-3", "12-25"
        // Value: the fact text itself (these don't follow a strict "year: text"
        // pattern the way Muffin Labs' data does, so we just store the full text).
        // ------------------------------------------------------------------
        const STCHARLES_FACTS = {
            "1-1": `On this day in 2015, the St. Charles County Police Department was established after a 2010 vote of the people to have a separate police and Sheriff’s Dept.`,
            "1-2": `In the year 1789 settlers in the village of Les Petite Côtes received permission from Spanish Lt. Gov. Don Manuel Perez to build a permanent house of worship which would become St. Charles Borromeo Catholic Church.`,
            "1-3": `On this day in 1926, a tornado moved through St. Charles County in St. Peters, O’Fallon, Wentzville and Gilmore causing damage.`,
            "1-4": `Gottfried Duden lived in this area for three years. Upon his return to his native Germany in 1829, he wrote self-published a book about his positive experiences which encouraged Germans to emigrate.`,
            "1-5": `The name of Gottfried Duden’s book about his time here was: “Report on a Journey to the Western States of North America and a Stay of Several Years along the Missouri.”`,
            "1-6": `Fort Zumwalt, log stronghold in present day O’Fallon, sheltered families during the War of 1812. It is now a city park.`,
            "1-7": `On this day in 1989, the first fifty-two prisoners were moved from the old jail on Second Street, St. Charles into the new 22 million dollar facility at 301 N. Second St.`,
            "1-8": `On this day in 1818, Missouri first’s statehood petition reached Congress- the road to St. Charles becoming the first state capital.`,
            "1-9": `On this day in 1739, Rebecca Bryan, the future wife of Daniel Boone, was born in VA.`,
            "1-10": `On this day in 1862, local Civil War Home guards and volunteer units were officially mustered out in St. Charles following a brief tour guarding critical area infrastructure and railroad bridges.`,
            "1-11": `On this day in 1865, Missouri abolished slavery by state ordinance, “Proclamation of Freedom”-months before the 13th Amendment.`,
            "1-12": `On this day in 1789, Joseph Rosatti was born in Sora, Italy. He would later serve as the first Catholic bishop of the Diocese of St. Louis which included St. Charles County.`,
            "1-13": `On this day in 1856, Augusta’s Harmonie-Verein was founded to promote music, social exchange and community.`,
            "1-14": `Portage de Sioux was founded in 1799 by François Saucier under the Spanish authority of Lt. Gov. Zenon Trudeau.`,
            "1-15": `On this day in 1870, the Missouri General Assembly worked on a framework for the state university system.`,
            "1-16": `In 1984, Wentzville passed a resolution to involuntarily annex a portion of Highway 61, starting the annexation sequence later reviewed in court.`,
            "1-17": `On this day in 1843, the practice of imprisoning debtors was outlawed in the State of Missouri.`,
            "1-18": `In 1790, Jacob Zumwalt accepted Spanish Land Grant #55 for 450 arpents (380.155 acres) which was located on both sides of the Belleau Creek.`,
            "1-19": `On this day in 1857, Othaniel Castlio provided land on Howell’s Prairie to establish the private one room school known as Howell’s Prairie School II.`,
            "1-20": `On this day in 1995, several Augusta area resources were added to the National Register. These included the Ewich Farmstead at 5336 Hackman Road, Gerling House at 245 Lower St, Mindrup House & Store at 3669 Mill St. and J. F. Schroer House at 252 Lower St.`,
            "1-21": `In 1800, Nathan Boone lived in a cabin, later replacing it with the large stone structure known today.`,
            "1-22": `Missouri’s government ran from the upper floor of the Peck Brothers Dry Goods and Hardware Store in St. Charles. The government was given the space rent free.`,
            "1-23": `In 1798, Spanish Lt. Gov. Zenon Trudeau granted Daniel Boone 1000 arpents (844.789 acres) of land in Louisiana Territory which would become St. Charles County.`,
            "1-24": `In 1800, Spain appointed Daniel Boone the Syndic and Commandant, in Upper Louisiana, now Missouri.`,
            "1-25": `On this day in 1908, the Cottleville Fire Department was founded, funded at first by a 75-cent per person fire-protection fee.`,
            "1-26": `The county’s namesake, St. Charles Borromeo, (Oct 2, 1538-Nov. 3, 1584), was a 16th-century Italian Cardinal and Arch-Bishop. The naming of the county occurred during Spanish control of the area that is now St. Charles County.`,
            "1-27": `Spain controlled Louisiana Territory from 1764 to 1800 governing the vast territory west of the Mississippi River which included what became St. Charles County.`,
            "1-28": `Through the secret Treaty of Fountainebleau of 1762, France gave the isle of Orleans and all western Louisiana territory to Spain to cover war losses from the Seven Years War.`,
            "1-29": `In 1800, through the Treaty of Ildefonso, Spain agreed to return the territory of the what would be described later as the Louisiana Purchase, to France in a secret deal,`,
            "1-30": `Between 1961-1971, the First Missouri State Capitol at 200 South Main Street, St. Charles was restored as a two-story Federalist-style brick building where the government was held from 1821 to 1826.`,
            "1-31": `In 1836, the St. Charles Fire Department began taxing citizens for the purpose of purchasing a fire engine and firefighting buckets.`,
            "2-1": `In 1846, the City of St, Charles School District was founded.`,
            "2-2": `On this day in 1816, early fur trader, landowner and community supporter François Duquette died in St. Charles.`,
            "2-3": `in 1837, St. Charles College was officially chartered in St. Charles.`,
            "2-4": `Early Cottleville hotels started in the 1830’s and 1840’s along the strategic Boone’s Lick Trail where travelers stayed due to muddy crossings or seasonal flooding.`,
            "2-5": `Cottleville was found in 1839 but the village was also known as “Dardenne” and “Pin Hook.”`,
            "2-6": `A post office was established in Cottleville in 1843.`,
            "2-7": `The North Missouri Railroad Company was chartered in 1851 and ran through St. Charles County.`,
            "2-8": `Wentzville was named for Erasmus Livingston Wentz¸chief engineer of the North Missouri Railroad when the town was laid out in 1855. William Allen donated the land and named the station and community after Wentz.`,
            "2-9": `On this day in 1839, MO Governor Lilburn Boggs signed legislation referred to as the “Geyer Act" established the University of Missouri in Columbia as the first public university west of the Mississippi River.`,
            "2-10": `O’Fallon was founded in 1856 by Nicholas and Arnold Krekel as a railroad stop. It was named for John O’Fallon, a St. Louis railroad executive and philanthropist.`,
            "2-11": `On this day in 1859, Nicholas Krekel was appointed postmaster of O’Fallon.`,
            "2-12": `To move early railroad cars from one side of a river to another, cars were moved onto specifically designed steam powered transfer boats which had tracks on their decks. Once on the other side of the river, the cars were pulled on the train tracks.`,
            "2-13": `In 1870, an iron and steel column of the St. Charles Bridge collapsed resulting in the death of 9 workers.`,
            "2-14": `On this day in 1959, the Orchard Farm School District was officially formed by combining smaller schools in Orchard Farm, Portage des Sioux and West Alton.`,
            "2-15": `American Car and Foundry Company (ACF) was formed in 1899 with the merger of thirteen smaller railroad manufacturers including St. Charles Car Co.`,
            "2-16": `On this day in 1847, the MO General Assembly passed a restrictive law affecting free African-American people.`,
            "2-17": `In 1814, the handling of the estate of Baptiste Point du Sable Jr. was settled in St. Charles County.`,
            "2-18": `The Missouri-Kansas-Texas Railroad (KATY) ran along the Missouri River bluffs through the county.`,
            "2-19": `The KATY Trail State Park was to have been completed in 1994 but the flood of 1993 delayed the opening of the St. Charles to Sedalia portion until 1996.`,
            "2-20": `At about 240 miles, the KATY Trail is America’s longest continuous rail-trail and its eastern end is at Machens, in northern St. Charles County.`,
            "2-21": `The Environmental Protection Agency (EPA) finalized the listing of the Weldon Spring Former Army Ordnance Works site on the Superfund National Priorities List in 1990.`,
            "2-22": `In 1851, the MO General Assembly approved state financial aid for railroad construction.`,
            "2-23": `In 1904, the first highway bridge at St. Charles opened- just in time for the World’s Fair traffic.`,
            "2-24": `In 1853, the MO General Assembly officially incorporated Linden Wood Female College (now Lindenwood University). On the same date, George and Mary Easton Sibley deeded the property to the St. Louis Presbytery.`,
            "2-25": `St. Peters was reclassified as a city. Its population went from 486 in 1970 to over 40,000 in 1990.`,
            "2-26": `In 1906, the O’Fallon Volunteer Fire Department was established. It transitioned to an organized fire protection district in 1970.`,
            "2-27": `On this day in 1876, a historic cyclone struck St. Charles at 1:30 pm damaging 36 homes and businesses and killing two people.`,
            "2-28": `In 1863, enslaved freedom seeker Archer Alexander fled across St. Charles County to Howell’s Ferry on the Missouri River after warning Union troops about a Confederate plot to sabotage a local railroad bridge.`,
            "2-29": `Wentzville’s fire department began in 1934 when early fire equipment was housed in the then new city hall. It operated as a volunteer department before becoming a fire protection district in 1971.`,
            "3-1": `In 1836, several former residents of St. Charles County including Jacob Darst and Jesse McCoy were part of the Gonzalez Regiment which entered The Alamo a few days before the final historic battle.`,
            "3-2": `On this day in 1800, Daniel Morgan Boone married Sarah Griffin Lewis at St. Charles Borromeo Catholic Church. Non-catholics were married by the priest, as shown by the church records,`,
            "3-3": `Pond Fort was a historic 19th century fortified settlement and War of 1812 refuge. It was located near present day Lake St. Louis.`,
            "3-4": `In 1895, a post office was officially opened in West Alton in the area that was originally known as Missouri Point.`,
            "3-5": `West Alton was incorporated as a city in 1996. It is located at the confluence of the Missouri and Mississippi Rivers.`,
            "3-6": `On this day in 1820, President James Monroe signed the Missouri Compromise with Missouri entering the union as a slave state and Maine as a free state.`,
            "3-7": `The New Melle Fire Department was established in 1951 as an all- volunteer department before expanding to include career firefighters.`,
            "3-8": `In 1832, Mary Easton Sibley had a spiritual awakening during the nationwide Evangelistic Movement called the “Second Great Awakening” and opened a Sunday School to teach Presbyterianism.`,
            "3-9": `On this day in 1804, Upper Louisiana formally passed from Spain to France at St. Louis, the first act of “Three Flags Day.”`,
            "3-10": `On this day in 1804, the American flag rose over Upper Louisiana and the area that would become St. Charles County was now officially part of the United States.`,
            "3-11": `Rufus Easton served as Attorney General for the Missouri Territory and with the organization of the state government he served as Missouri Attorney General from 1821 to 1826.`,
            "3-12": `In 1904, the Augusta Volunteer Fire Company was formed. The Augusta Fire Protection District was formed in 1971.`,
            "3-13": `The earliest deed for All Saints Catholic Church in St. Peters was from 1815. The cornerstone for the present church was laid in 1855.`,
            "3-14": `On this day in 1991, Frenchtown Historic District in St. Charles was listed in the National Register of Historic Places.`,
            "3-15": `The O’Fallon unit of the Boys and Girls Club of St. Charles County officially opened expanding the organization county-wide in 1994.`,
            "3-16": `In 1818, the Academy of the Sacred Heart in St. Charles opened as the first free school west of the Mississippi River and the first Sacred Heart school established in North America. It was founded by Rose Philippine Duchesne.`,
            "3-17": `O’Day Park in O’Fallon is named for Irish-born Edward F. O’Day who became a prominent farmer in the area. It officially opened on May 14, 2019.`,
            "3-18": `Rebecca Boone, Daniel’s wife of 56 years, died in 1813.`,
            "3-19": `In 1835, the MO General Assembly passed a landmark act providing for the organization, regulation and funding of common public schools across the state including St. Charles County.`,
            "3-20": `In 1954, two tornadoes touched down nearby in St. Charles County packing winds of F1 and F3.`,
            "3-21": `On this day in 1818, Rose Philippine Duchesne and four other nuns left France for North America on the ship Rebecca.`,
            "3-22": `In 1956, St. Charles Community Council met and appointed a special committee to establish a county-wide organization leading to the official founding of the St. Charles County Historical Society.`,
            "3-23": `The St. Charles Bridge over the Missouri River officially re-opened to traffic in 1918 after its wooden deck was completely rebuilt following a major fire.`,
            "3-24": `Before Prohibition began in 1920, Missouri ranked among America’s top wine states.`,
            "3-25": `In 1851 the Steamboat St. Anthony sank near St. Charles.`,
            "3-26": `Wentzville was incorporated in 1872 as a fourth class city.`,
            "3-27": `Femme Osage Post Office was in operation from 1816 until 1933.`,
            "3-28": `In 1960, the St. Charles Boys Club held an official “Kick Off Dinner” to raise monies for a new building on land adjacent to Blanchette Park.`,
            "3-29": `In 1973, rising flood waters from the Missouri River breached a levee in St. Charles County east of the Highway 367 Bridge.`,
            "3-30": `In 1863, St. Louis abolitionist William Greenleaf Eliot wrote a letter to Richard Pitman offering to purchase the freedom of Archer Alexander from him.`,
            "3-31": `The Boone’s Lick Road or Boonslick Trail was a 150-mile overland route during the 1800’s from St. Charles west to Old Franklin in Howard County. It later served as a first leg of the Santa Fe Trail.`,
            "4-1": `Actor Paul Newman raced and won the GT-1 Class race at Mid America Raceway in 1982. The track closed in 2004 and the land would be turned into a subdivision.`,
            "4-2": `On this date in 2025, Westhoff Grain and Mercantile at 108 S. Main, O’Fallon was listed in the National Register of Historic Places.`,
            "4-3": `Immaculate Conception Catholic Church began in 1880 as a small quiet, rural faith community. The school was established in 1881.`,
            "4-4": `The Weldon Spring Ordnance Works was a 17,323 acre World War II explosives plant. Built in 1941 and operated by Atlas Powder Company it produced TNT and DNT. The contaminated site was cleaned up by 2001.`,
            "4-5": `In 1916, Sheriff John Dierker was shot and killed trying to effect an arrest. He was forty-six years old and had been married for six weeks.`,
            "4-6": `in 1839, New Melle was settled by German immigrants from Melle, Germany. The community was plotted in 1850 and officially incorporated as a city in 1978.`,
            "4-7": `In 1805 on their way back to what would become Missouri, the Lewis and Clark Expedition dispatched its return keelboat loaded with journals, maps, and native wildlife specimens from Fort Mandan down the Missouri River.`,
            "4-8": `In 1850 the Masonic Lodge of St. Charles held an open house and hosted its very first meeting inside its newly raised building at 122 S. Main.`,
            "4-9": `On this day in 1844, the Verein der Vernunflglaüben (Association of Rationalists) was founded in Augusta and prominent leader and attorney Arnold Krekel was one of the charter members.`,
            "4-10": `The Great Flood of 1993 lasted approximately 200 days from April to October primarily along the Missouri and Mississippi Rivers and their tributaries.`,
            "4-11": `On this day in 1972, the Newbill-McElhiney House at 625 South Main, St. Charles was listed in the National Register of Historic Places. On this day in 1973, the Daniel Boone House near Defiance was added to the same list.`,
            "4-12": `On this day in 1812, St. Charles County was officially organized as one of the five original counties of the Missouri Territory.`,
            "4-13": `On this day in 1987, St. Charles Odd Fellows Hall at 117 S. Main, St. Charles was listed in the National Register of Historic Places.`,
            "4-14": `St. Charles County voters created the county park system in 1997 with a dedicated use tax. Today the system comprises 4403 acres across 22 parks.`,
            "4-15": `In 2023, the St. Charles County Veterans Museum located in O’Fallon officially changed its name to the Mid America Veterans Museum.`,
            "4-16": `On this day in 1969, the First Missouri State Capitol Building at 206-216 South Main Street, St. Charles was listed in the National Register of Historic Places.`,
            "4-17": `Edward Bates, born in VA, served in Abraham Lincoln’s cabinet as US Attorney General from March 1861 until November 1864. He was the first Cabinet appointee from a state west of the Mississippi River.`,
            "4-18": `Frederick Bates, brother of Edward, served as Governor of Missouri from November 15, 1824 until his death on August 4, 1825.`,
            "4-19": `The historic Bates family property was a 500 acre plantation in Dardenne Prairie established by Edward. It was named Cheneaux and later was home to his son Barton, also a political figure.`,
            "4-20": `Founded in 1833, the Femme Osage United Church of Christ was the first German Protestant (Evangelical) church established west of the Mississippi.`,
            "4-21": `Orchard Farm took its name from the fruit farms of the Mississippi bottomlands. A local post office opened in 1894 and operated until 1953.`,
            "4-22": `The St. Charles Trolley returned to Main Street in 2022 providing free weekend hop on/hop off transportation loops.`,
            "4-23": `The Daniel Boone Hays House, southwest of Defiance off Highway F was listed in the National Register of Historic Places. He was Daniel Boone’s grandson.`,
            "4-24": `Founded in the late 1850’s, Christ Lutheran Church of Augusta began when local Lutherans held services in private homes led by a visiting pastor from New Melle.`,
            "4-25": `Defiance is in unincorporated St. Charles County and was first inhabited by the Osage Nation. Daniel Boone and others settled there in the late 1790’s. The town was founded with the arrival of the railroad in the late 19th century.`,
            "4-26": `Heavy spring flooding in 1820 struck St. Charles County causing the Missouri River to swell and overflow so severely that almost every store of any kind in the area was underwater.`,
            "4-27": `On this day in 2025, a historical marker dedication was held at Ft. Zumwalt in O’Fallon honoring American Revolutionary War patriot Jacob Zumwalt.`,
            "4-28": `KATY Trail State Park is the longest developed rail-trail in the United States running 240 miles from Machens, in northern St. Charles County to Clinton, in Henry County.`,
            "4-29": `Civil War battles and skirmishes occurred in Missouri, including St. Charles County. Missouri ranked third among all states for the total number of military engagements behind only VA and TN.`,
            "4-30": `On this day in 1803, The Louisiana Purchase Treaty was concluded and signed in Paris by the American envoys.`,
            "5-1": `On this day in 1991, St. Charles Historic District Boundary Increase II was listed in the National Register of Historic Places.`,
            "5-2": `During the 1800’s, St. Charles served as a crucial stopping point for steamboats carrying pioneers, fur traders and heavy cargo up and down the Missouri River.`,
            "5-3": `The Goldenrod Showboat was docked and operated as a popular floating dinner theater until 2002. It was destroyed by fire in 2017.`,
            "5-4": `On this day in 1832, George S. Myers, later associated with Liggett & Myers Tobacco Company, was born in Flint Hill. He died in CA in 1910.`,
            "5-5": `In the 19th and early 20th centuries, St. Charles County, particularly around Wentzville and Callaway townships, was a major hub for tobacco farming and manufacturing.`,
            "5-6": `On this day in 1919, State of MO General Assembly enacted a law providing grants to help finance county World War I memorials.`,
            "5-7": `During the mid to late 1800’s, local farmers relied on tobacco as a primary cash crop, By 1860, county farmers produced 145 tons of leaf tobacco.`,
            "5-8": `As the 20th century progressed, large scale production of tobacco faded in the county in favor or general grain farming.`,
            "5-9": `On this day in 2004, the 1,121 acre site known as Edward “Ted” and Pat Jones Confluence Point State Park opened. It marked the merger of Mississippi and Missouri Rivers.`,
            "5-10": `Founded in St. Louis in 1873, Liggett & Myers grew from a 19th century chewing tobacco powerhouse into a major American cigarette producer, famous for brands such as Chesterfield and L&M.`,
            "5-11": `Liggett & Myers Company was incorporated in 1878 and by 1895 it became the world’s largest maker of molasses-sweetened plug chewing tobacco anchored by its famous “star.”`,
            "5-12": `Farming in St. Charles County began with French colonial common fields. An original land grant was from Jan. 25, 1797. These fields were narrow strips of land.`,
            "5-13": `On this day in 2003, the Lewis and Clark Boathouse and Museum was dedicated. Annually, about 25,000 visit the museum with about 5,000 school children visiting. As a stop on the Lewis and Clark National Historic Trail, the museum offers the Junior Ranger and National Park Service Passport cancellation.`,
            "5-14": `By the mid 19th century, German immigrants heavily populated the upland farms and river corridors of the county, establishing deeply rooted agricultural homesteads.`,
            "5-15": `The keelboat, historically, was a shallow river height boat used in early American expansion including on the Missouri River.`,
            "5-16": `In 1804, William Clark’s party arrived at St. Charles around noon and remained there while waiting for Meriwether Lewis.`,
            "5-17": `A pirogue was a small light, flat bottomed boat similar to a canoe traditionally made by hollowing out a large log (dugout) which was pointed at both ends and moved with a paddle or pole. It was used extensively on the Missouri River.`,
            "5-18": `On this day in 2019, St. Charles celebrated with a Sestercentennial (250th) anniversary festival of the founding of St. Charles by Louis Blanchette.`,
            "5-19": `York, the enslaved African-American and personal servant of William Clark was on the Lewis and Clark Expedition (also known as Corps of Discovery).`,
            "5-20": `On this day in 1804, Meriwether Lewis arrived in St. Charles at about 6:30 pm to join Clark and the rest of the expedition. In his journal, he refers to the “Vilage of St. Charles.”`,
            "5-21": `The Missouri River, at 2341 miles is the longest river in the United States. St. Charles sits on the western bank of this river with the nickname of the “Big Muddy.”`,
            "5-22": `The Missouri River starts in Montana and flows through seven states before ending where it flows into the Mississippi River in St. Charles County.`,
            "5-23": `The Missouri River served as the core highway for the 1804-1806 Lewis and Clark Expedition (Corps of Discovery) and for other 19th century pioneers.`,
            "5-24": `The word “Missouri” comes from the indigenous Missouri tribe, meaning “people of the wooden canoe.”`,
            "5-25": `In 1780, Louis Blanchette is listed on the St. Louis Militia list for those involved with the Battle of St. Louis.`,
            "5-26": `On this day in 1780, the Battle of St. Louis occurred in what is now downtown St. Louis with individuals from St. Charles or those who would later live in St. Charles County after the battle, helping with the fight.`,
            "5-27": `Veterans are honored at St. Charles Veterans Memorial overlooking the Missouri River, Veterans Tribute Park and Mid Missouri Veterans Museum, Wentzville Vietnam Memorial and Korean War Memorial South.`,
            "5-28": `On this day in 1992, the Staudinger-Grumke House-Store in Augusta at 5503 Locust was listed in the National Register of Historic Places,`,
            "5-29": `On this day in 1818, Rose Philippine Duchesne and four other nuns landed in New Orleans. They traveled to St. Louis and at the direction of Bishop Dubourg, the group of five went to St. Charles.`,
            "5-30": `St. Charles County covers approximately 560 square miles in land and 33 square miles of water.`,
            "5-31": `After the Louisiana Purchase, the original District of St. Charles (later St. Charles County) spanned from the Missouri River on the south to the British possessions on the north and from the Mississippi River on the east all the way to the Pacific Ocean on the west.`,
            "6-1": `On this day in 1890, a unique pontoon bridge built using 50 separate barges opened to the public. This was the first non-railroad bridge across the Missouri River at St. Charles.`,
            "6-2": `In June 1841, Rose Philippine Duchesne traveled to the Potawatomi Mission at Sugar Creek KS to fulfill a lifelong dream to minister to Native Americans. She stayed one year before returning to St. Charles.`,
            "6-3": `Southwest St. Charles County became historically significant for winemaking primarily because of the German immigrants who settled there between 1830-1850.`,
            "6-4": `On this day in 1987, St. Charles Historic District Boundary Increase I was listed in the National Register of Historic Places.`,
            "6-5": `The 1820 Missouri Constitution required the permanent seat of government to be located within 40 miles of the state’s geographic center along the Missouri River.`,
            "6-6": `In June 1980, the Augusta American Viticultural Area (AVA) was recognized as the very first AVA in the United States, predating Napa, CA.`,
            "6-7": `General Motors opened its Wentzville plant in 1983 with a 3.7 million square foot facility sitting on 569 acres.`,
            "6-8": `In 1849, many prospectors from St. Charles County packed wagon trains and headed west via the Oregon-California trails to reach the goldfields.`,
            "6-9": `In 1821, a MO legislative committee selected a site originally known as “Lohman’s Landing” as the site for the next capitol. It was later named for Thomas Jefferson.`,
            "6-10": `St. Charles competed with eight other cities to become the first state capital. St. Charles offered a prime location on trade routes and provided free space for lawmakers.`,
            "6-11": `On this day in 1800, Spanish Lt. Gov. Carlos Dehault Delassus appointed Daniel Boone as the Commandant of the Femme Osage District.`,
            "6-12": `On this day in 1820, the constitutional convention met at the Mansion House in St. Louis to complete drafting Missouri’s first constitution.`,
            "6-13": `The primary and earliest German language newspaper in St. Charles County was the St. Charles Demokrat (or Der St. Charles Demokrat), founded by Arnold Krekel in 1852.`,
            "6-14": `The St. Charles Demokrat newspaper was strongly anti-slavery, liberal and unionist.`,
            "6-15": `Josephville began in 1837 as Allen’s Prairie, a small farming and mail stop. It was named after its first postmaster, Joseph Wilmes.`,
            "6-16": `On this day in 1941, the Jungerman family home in Howell, MO was officially condemned as the federal government used eminent domain to acquire hundreds of properties to construct the Weldon Spring Ordnance Works.`,
            "6-17": `Flint Hill was founded in 1836 by Capt, Taliaferro P. Grantham and was named by settlers from Flint Hill, VA who thought the local terrain resembled their former home.`,
            "6-18": `In 1812, the United States declared war on Great Britain beginning the War of 1812. In St. Charles County, Callaway’s Rangers organized for regional defense.`,
            "6-19": `St. Charles County never had its own dedicated French-language newspaper during its settlement period despite being founded by French-Canadian fur traders.`,
            "6-20": `On this day in 1878, Mary Easton Sibley, known affectionately as “Aunt Mary,” and the co-founder of what became Lindenwood University, died in her sleep at age 78. She was buried in the cemetery on the grounds of Lindenwood.`,
            "6-21": `The U.S. Board of Geographic Names officially approved designating a local stream, located in O’Fallon between Highway K and Route 364, as Archer Alexander Creek to honor the former enslaved man in 2021.`,
            "6-22": `On this day in 1929, Memorial Hall in Blanchette Park in St. Charles was officially dedicated with a bronze tablet to honor the county soldiers who died in World War I. A series of plaques were later added for veterans of World War II, Korea and Vietnam.`,
            "6-23": `Pre-Prohibition wine cellars still tunnel beneath Augusta’s hillsides and are used to age wines and ports.`,
            "6-24": `In 1884, a massive 283-foot sternwheel steamboat Montana struck the pier of the railroad bridge in St. Charles, tearing open the hull and wreckage remains in the water to this day.`,
            "6-25": `On this day in 1976, MO Governor Christopher “Kit” Bond officially declared the 1838 order of then Gov. Lilburn Boggs to drive Mormons from the state as legally void and unconstitutional.`,
            "6-26": `On this day in 1892, a severe lightning strike hit and heavily damaged the original 158-foot steeple of the historic Immanuel Lutheran Church sanctuary in St. Charles.`,
            "6-27": `St. Charles Community College was established in 1986 when voters approved the college district.`,
            "6-28": `On this day in 1821, the MO legislature meeting in St. Charles passed the “Solemn Public Act” which was a critical step required by U.S. Congress allowing MO to finally form its state constitution and clear the path to statehood.`,
            "6-29": `The Francis Howell School District officially organized as Consolidated District No. 2 of St. Charles County in 1915.`,
            "6-30": `In June 1987, St. Charles Community College held its first classes with nearly 400 students before expanding to an enrollment of over 1500 students by its first official fall semester.`,
            "7-1": `Henry W. Williams opened a drug store in Cottleville in 1879 and the Commercial Hotel in 1881. The hotel was considered to be one of the best small hotels along the Wabash Railroad.`,
            "7-2": `The idea to establish a public park system in St. Charles began in 1914 when local citizens petitioned the City Council to place a $90,000 bond issue on the ballot to purchase the 42-acre tract of land which was named Blanchette Park on Dec. 7, 1914.`,
            "7-3": `On this day in 1988, Rose Philippine Duchesne of St. Charles was canonized a saint by Pope John Paul II.`,
            "7-4": `On this day in 1871, the St. Charles Railroad Bridge was officially dedicated making it the longest bridge in the United States.`,
            "7-5": `On this day in 1990, Wentzville Tobacco Company Factory at 406 S. Elm Street was listed in the National Register of Historic Places.`,
            "7-6": `On this day in 1972, voters approved 171 yes to 7 no votes to officially form the Lake St. Louis Fire Protection District.`,
            "7-7": `On this day in 1915, a deadly tornado crossed St. Charles County from Foristell to Wentzville through Gilmore, O’Fallon, St. Peters, and St. Charles killing four people and damaging many buildings including St. Charles Borromeo Church.`,
            "7-8": `Following the Great Flood of 1993, federal, state and local buyouts turned flooded areas into permanent, deed-restricted open floodplains.`,
            "7-9": `The National Old Trails Road (or Ocean-to-Ocean Highway) was a historic 3,096 mile transcontinental auto route established in 1912 that included the Boone’s Lick Road and Santa Fe Trail. Portions of this road became Route 66 in 1926.`,
            "7-10": `On this day in 1883, the cornerstone was laid for St. Theodore Catholic Church in Flint Hill. The German families in the area raised the wooden church in just over a month.`,
            "7-11": `By Bill No. 175 and Ordinance No. 167, the Lake St. Louis Police Department was created when the ordinance was passed and signed in 1981.`,
            "7-12": `On this day in 1978, the Dr. John H. Stumberg House at 100 S. 3rd Street, St. Charles was listed on the National Register of Historic Places. On the same day in 2002, the Meier General Store in New Melle at 3669 Mill Street was listed on the same register.`,
            "7-13": `On this day in 1873, Point Prairie, a local community and church, was officially organized. Now part of Orchard Farm, the church is now Trinity Lutheran.`,
            "7-14": `American Revolutionary War patriots are buried in St. Charles County in cemeteries such as Oak Grove, St. Charles Borromeo, Zion Lutheran O’Fallon and other areas where family cemeteries existed.`,
            "7-15": `On this day in 1901, construction on the historic St. Charles County Court House began. The building at 3rd and Jefferson Streets in St. Charles is now the County Executive Building.`,
            "7-16": `French fur traders came to what would become St. Charles County because of its strategic location along the Missouri River.`,
            "7-17": `On this day in 1806, Zebulon Pike and his party camped near St. Charles as they were heading up the Missouri River. He died during the War of 1812. Pike’s Peak in CO is named for him.`,
            "7-18": `On this day in 1815, treaties with the Potawatomi and Piankashaw tribes were signed at Portage des Sioux. In the aftermath of the War of 1812, an attempt was made to re-establish friendly relations between the US and midwestern Native American tribes.`,
            "7-19": `On this day in 1815, Treaties of Portage des Sioux were signed in the Missouri territory. The agreements were negotiated to try to establish peace and friendship by William Clark, IL Gov. Ninian Edwards and Auguste Chouteau.`,
            "7-20": `The “Makah at Portage de Sioux” refers to ratified Indian treaty #68, a peace and friendship agreement between the US and Maha (Omaha) peoples. It has been misspelled as “Makah” not “Maha.”`,
            "7-21": `On paper the treaties signed in 1815 such as those signed at Portage des Sioux “restored” tribal rights but in practice they opened Missouri to statehood and stripped the tribes of their land and caused their removal from the area. This led to the Black Hawk War of 1832.`,
            "7-22": `Peace treaties of 1815 signed at Portage des Sioux involved more than a dozen Native nations. The site was chosen as it was easy to reach by boat for tribes living along the Mississippi, Missouri and Illinois rivers.`,
            "7-23": `A marker in Portage des Sioux remembers the treaty grounds and is located on River View Drive along the walkway to our Lady of the Rivers shrine.`,
            "7-24": `On this day in 1867, residents of Portage des Sioux held a large community barbecue to raise money to support the building of a railroad connecting St. Charles County and Alton, IL.`,
            "7-25": `Marais Croche, which means “crooked lake” or “crooked marsh” is a long, winding, marsh-like depression and old river bed segment in Northern St. Charles County.`,
            "7-26": `On this day in 2022, severe storms dropped over twelve inches of rain in parts of St. Charles County causing historic flooding and widespread rescues.`,
            "7-27": `On this day in 1833, a severe cholera outbreak that hit the county was reported to be slowing down though the epidemic still raged in Portage des Sioux.`,
            "7-28": `On this day in 1849, a devastating cholera epidemic that had swept across the Midwest including St. Charles County was subsiding.`,
            "7-29": `On this day in 1969, the Stone Row, 314-330 Main Street in St. Charles was listed on the National Register of Historic Places.`,
            "7-30": `On this day in 1993, during the catastrophic flooding, the Monarch levee in Chesterfield Valley failed, sending massive floodwaters across the Missouri River into St. Charles County.`,
            "7-31": `The Wentzville School District traces its origins to 1896 with the founding of the area’s first high school.`,
            "8-1": `On this day in 1770, William Clark of the Lewis and Clark Expedition, was born in Caroline County, VA.`,
            "8-2": `Originally known simply as Wentzville High School, it became a four- year high school in 1939 and was re-named for Emil E. Holt Sr. in 1969.`,
            "8-3": `Immanuel Lutheran Church, St. Charles, first held school classes in Klinger Mill on Main Street in the fall of 1848.`,
            "8-4": `On this day in 1829, Mary Easton and George Sibley bought 280 acres of land in the common fields of St. Charles. This property would become Lindenwood University.`,
            "8-5": `On this day in 1862, marked the official initial enrollment for the 27th Regiment, Enrolled Missouri Militia, which served local home guard and defensive duties in and around St. Charles County.`,
            "8-6": `On this day in 2013, the Oliver L. and Catherine Link House at 1005 Jefferson, St. Charles was listed in the National Register of Historic Places.`,
            "8-7": `In 1808, Territorial Governor Meriwether Lewis ordered St. Charles Militia to active readiness during heightened frontier tensions which caused settlers to fortify positions across the county.`,
            "8-8": `In 1975, Harbor Town was incorporated as a town. Residents later voted to rename the area and the city of Lake St. Louis was formed in 1977.`,
            "8-9": `On this day in 1834, the important road connecting St. Louis to St. Charles, originally laid out in 1772 and later improved into a rock surface route, was officially declared the St. Charles Rock Road.`,
            "8-10": `On this day in 1821, President James Monroe signed the proclamation admitting Missouri as the 24th state and St. Charles would serve as the temporary state capitol.`,
            "8-11": `On this day in 1958, the unique roadside shrine known as Our Lady of the Way (Our Lady of Missouri) was originally placed by 25 local laymen volunteers at Interstate 70 and Highway 79 in St. Peters. It was dismantled in May 1985, rebuilt and rededicated on Nov. 2, 1987 at location just south of I-70.`,
            "8-12": `On this day in 1812, St. Charles County was officially organized as one of the original five counties of the Missouri Territory.`,
            "8-13": `On this day in 1956, paving began on Interstate 70 in St. Charles County near the modern day Fifth Street exit in St. Charles. This was the first construction of the Interstate era.`,
            "8-14": `Originally started in 1862 as Regional School (“Number 2”) by Immanuel Lutheran Church for families living in the Prairie District between the Missouri and Mississippi Rivers, this would become an independent congregation and school entity in the 1870’s and was located in Orchard Farm.`,
            "8-15": `On this day in 1883, brand-new St. Theodore Catholic Church at Flint Hill was blessed- about five weeks after the cornerstone was laid. It was named for Fr. Theodore Krainhardt.`,
            "8-16": `The Festival of the Little Hills has drawn crowds to Main Street in St. Charles every August since 1971, when the first one was held August 10th to 15th.`,
            "8-17": `On this day in 1845, delegates gathered to re-write Missouri’s Constitution.`,
            "8-18": `Founded by six Lutheran Church- Missouri Synod Congregations, Lutheran High School St. Charles opened in 1982 with 17 students in a temporary site in O’Fallon.`,
            "8-19": `Howell Island Conservation Area is located across the Missouri River from Weldon Spring Conservation Area and is accessed only by boat. The area is now managed and maintained by the Army Corps of Engineers.`,
            "8-20": `Duchesne High School began as St. Peter High School in 1924. It expanded to a four year school in 1929 and moved from its Clay Street location to a new campus on Elm Street in St. Charles in 1956. The School is named for Rose Philippine Duchesne.`,
            "8-21": `On this day in 1829, 24-year-old William Campbell began documenting a historic overland migration of 50 travelers including 25 enslaved individuals from Lexington, VA to Dardenne Township, St. Charles County. One of the enslaved was Archer Alexander.`,
            "8-22": `On this day in 1984, Wentzville certified election results in favor of involuntarily annexing an uninhabited portion of land along Highway 61.`,
            "8-23": `St. Dominic Catholic High School traces its roots back to 1929 with the opening of Assumption High School. In 1962, it was transitioned into a regional high school and renamed in honor of St. Dominic Guzman and was staffed with Dominican Sisters of Sparkill.`,
            "8-24": `On this day in 2005, Construction for the remedial action was completed for the Weldon Spring Former Army Ordnance Works Superfund site.`,
            "8-25": `On this day in 1808, William Clark and a mounted company of 80 St. Charles Dragoons (militia & volunteers) left St. Charles to construct Fort Clark, later renamed Fort Osage, Jackson County, MO.`,
            "8-26": `On this day in 1904, the 1904 World’s Fair in St. Louis celebrated St. Charles Day. This was part of Missouri Week in which different counties and cities were celebrated.`,
            "8-27": `Steamboats traveling on the Mississippi River from New Orleans served as the primary carrier of bringing the waterborne Vibrio Cholerae bacteria to the state of Missouri in late 1848 and early 1849.`,
            "8-28": `On this day in 1820, Missourians voted in their first state election, choosing a governor and the legislature that would sit in St. Charles.`,
            "8-29": `In the 1840’s, German immigrants traveled by ocean ship to New Orleans then up the Mississippi River to St. Louis and then pushed west into St. Charles County via the Missouri River or the overland Boone’s Lick Road.`,
            "8-30": `Around 1805, Nathan and Daniel Morgan Boone started a commercial salt-manufacturing operation at a saline spring in Howard County. They boiled heavy saline in large kettles to evaporate the water and extract the crystallized salt.`,
            "8-31": `St. Charles County resident’s efforts led to the founding of Families for Home Education in 1983. Senate Bill 795 was passed in 1986 which enacted a homeschool bill establishing legal protections and requirements for home educators across the state.`,
            "9-1": `On this day in 1797, Spanish Lt. Gov. Zenon Trudeau officially granted Daniel Morgan Boone 600 arpents of land in what would become St. Charles County.`,
            "9-2": `On this day in 1813, MO Territorial Governor William Clark appointed Martin Ruggles as Captain of a mounted militia helping organize frontier defenses as regionalized conflicts escalated during the War of 1812.`,
            "9-3": `In 1961, the city of St. Peters had one police constable and an active St. Peters Civil Defense Auxiliary Police Force. The force had one panel truck equipped for emergency work and four members.`,
            "9-4": `St. Paul’s Catholic Church in St. Paul began in 1836 when German farming families built a small wooden chapel in the Dog Prairie area.`,
            "9-5": `Dog Prairie was a historic 19th century open grassland and settlement area located north of Peruque Creek near present day St. Paul.`,
            "9-6": `The post office in Schluersburg was established in 1862 during the Civil War and remained a communication hub for local farmers until it closed in 1908.`,
            "9-7": `When the Academy of the Sacred Heart, St. Charles was founded in September 1818, it was a free school for local children as Philippine Duchesne wanted to provide a formal education for the local poor and frontier girls.`,
            "9-8": `On this day in 1799, George Gaty was issued a land grant for 450 arpents (382.5 acres) of land north of the Salt River Road in the bottomlands.`,
            "9-9": `On this day in 1982, St. Paul’s Lutheran Church on State Road D in New Melle was listed in the National Register of Historic Places.`,
            "9-10": `On this day in 2004, the Isaac McCormick House at 705 MO Highway F near Defiance was listed on the National Register of Historic Places.`,
            "9-11": `The Shrine of St. Philippine Duchesne at 619 N. Second Street in St. Charles draws pilgrims from around the world. The Shrine is open for pre-arranged tours.`,
            "9-12": `On this day in 1815, Tribal Chiefs of the Osage and Missouri Nations signed a historic peace and friendship treaty in Portage des Sioux.`,
            "9-13": `An arpent is an old French unit to measure both length and area. As a measure of area, one square arpent equals about .84 to .85 of an English acre. As a linear measure, an arpent is roughly 192 feet (about 58 to 59 meters).`,
            "9-14": `The Giessen Emigration Society was a group of over 500 German immigrants who arrived in 1834 with Paul Follenius and Friedrich Muench, They settled in St. Charles, Warren and Franklin counties.`,
            "9-15": `The earliest Methodist Congregation in St. Charkes County was the First St. Charles United Methodist Church which was established on Main Street in 1821.`,
            "9-16": `The Steamboat Independence was the first to successfully navigate an extended voyage up the Missouri River in 1819 during its 150- mile journey from St. Louis to Franklin, in Howard County. It stopped in St. Charles on its journey.`,
            "9-17": `Baptists began holding informal home services in St. Charles County around 1796.`,
            "9-18": `On this day in 1819, the Dardenne Presbyterian Church was founded. It is one of the oldest Presbyterian churches west of the Mississippi River.`,
            "9-19": `On this day in 1848, the cornerstone of St. Peter Catholic Church in St. Charles was set at this German-American church.`,
            "9-20": `As early as 1807, Rev, Jesse Walker held Methodist services and administered first Communion in the area of Fort Zumwalt.`,
            "9-21": `On this day in 1806, Lewis and Clark’s party concluded its overnight return stop in St. Charles and continued on to St. Louis,`,
            "9-22": `On this day in 1970, St. Charles Historic District was listed in the National Register of Historic Places.`,
            "9-23": `The Samuel Stewart Watson House at 205 S. Duchesne, St. Charles was listed in the National Register of Historic Places.`,
            "9-24": `On this day in 1863, enslaved Archer Alexander officially received his freedom and formal emancipation announcement in newspapers for risking his life to warn Union troops of a Confederate plot.`,
            "9-25": `On this day in 1912, O’Fallon was incorporated. This city is now the largest in St. Charles County.`,
            "9-26": `On this day in 1820, Daniel Boone died at son Nathan’s stone house near Defiance, at age 85.`,
            "9-27": `On this day in 1817, Thomas Hart Benton and Charles Lucas engaged in a duel on Bloody Island. Lucas, who was the Attorney General for the District of Missouri, which included St. Charles County, was killed.`,
            "9-28": `The October 1818 session of the Missouri Baptist Association was held in the Femme Osage Settlement.`,
            "9-29": `On this day in 1994, Several Augusta sites were included in the list of National Register of Historic Places. These included: Harold-Knoernschild Farmstead at 199 Jackson Street; Mt. Pleasant Winery Historic District, 5634 High Street; Sehrt House at 275 Webster Street and Walnut Street Historic District.`,
            "9-30": `Fort Zumwalt School District began in 1952 with a single school building. It was named for Jacob Zumwalt’s historic 1798 frontier fort.`,
            "10-1": `Train sparks ignited pigeon nests underneath the St. Charles Bridge deck, destroying the span in 1916.`,
            "10-2": `On this day in 1858, St. Charles Lodge #126 of Independent Order of Odd Fellows was officially chartered in St. Charles.`,
            "10-3": `On this day in 1837, abolitionist editor Elijah Lovejoy visited a home in St. Charles hours before he was killed in Alton, IL.`,
            "10-4": `Femme Osage is an unincorporated historic settlement in southwest St. Charles County along the Femme Osage River.`,
            "10-5": `In 1965, Clay Street in St. Charles was re-named First Capitol Drive to highlight the reconstruction of the First State Capitol location on Main Street, where the upper rooms served as the meeting location for the governor and legislators when St. Charles served as the State Capitol from 1821-1826.`,
            "10-6": `When Spain transferred Louisiana back to France and the United States in 1803, higher level administrative and military records went to Havana, Cuba. Many of these papers are now housed in the Archivo General de Indias in Seville, Spain.`,
            "10-7": `On this day in 1902, the St. Charles School District officially opened Franklin School to provide education to African-American children.`,
            "10-8": `St. Charles County Historical Society (SCCHS) preserves church, probate, naturalization, land records and more in its building at 101 S. Main Street, St. Charles.`,
            "10-9": `In 1963, McDonnell Douglas began renting space from the Sterling Aluminum Foundry in St. Charles before purchasing it in 1966. With the merger in 1997, the facility became a Boeing property.`,
            "10-10": `In 1986, Octoberfest began in St. Charles as a small community celebration and continues to this day.`,
            "10-11": `On this day in 1979, the Marten-Becker House at 837 First Capitol Drive in St. Charles was listed in the National Register of Historic Places.`,
            "10-12": `St. Charles has had a Sister Cities relationship with Ludwigsburg Germany since 1996.`,
            "10-13": `On this day in 1809, the village of St. Charles was officially incorporated by the Court of Common Pleas for the District of St. Charles.`,
            "10-14": `The St. Charles County Fair has roots going back to the “St. Charles Driving Park and Fair Association” formed around 1890.`,
            "10-15": `On this day in 2011, the Audubon Center at Riverlands opened at West Alton. It is a 15 acre conservation hub located within the 3700 acre Riverlands Migratory Bird Sanctuary along the Mississippi River.`,
            "10-16": `On this day in 1922, newly appointed St. Charles Park Board officially convened its first meeting.`,
            "10-17": `On this day in 2016, Lindenwood Neighborhood Historic District in St. Charles was listed in the National Register of Historic Places.`,
            "10-18": `On this day in 1865, members of the local African American community met with the African Methodist Episcopal (AME) Conference leading to the creation of historic regional churches like St. John AME. For the previous decade, the church had been Methodist Episcopal Church, South.`,
            "10-19": `The Sister Cities partnership between St. Charles and Inishowen Peninsula in County Donegal Ireland has existed since 2016.`,
            "10-20": `On this day in 1803, The United States Senate ratified the Louisiana Purchase. The US paid fifteen million dollars for the 828,000 square miles of land.`,
            "10-21": `On this day in 1826, the State of Missouri officially completed its final transition of the government from St. Charles to Jefferson City.`,
            "10-22": `The original St. Charles County Fairgrounds was acquired by the City of St. Charles in 1914 and became Blanchette Park.`,
            "10-23": `The St. Louis, St. Charles and Western Railway was an electric interurban line which opened in the early 1900’s and ran until January 17, 1932. The line used a special combination highway and rail bridge connecting St. Charles at 2nd and Adams Streets to Wellston in St. Louis County.`,
            "10-24": `On this day in 1831, the early side wheel steamboat, The Liberty, struck a snag and sank at Brick House Bend on the Missouri River just below St. Charles.`,
            "10-25": `St. Charles County participated in the 1904 World’s Fair in St. Louis by sending award-winning agricultural products to the global exhibition.`,
            "10-26": `On this day in 2007, St. Mary’s Institute at 204 North Main, O’Fallon was listed in the National Register of Historic Places.`,
            "10-27": `On this day in 1838, Gov. Lilburn Boggs, during conflicts between early settlers and Mormons in western Missouri, declared that Mormons had to be treated as enemies and driven from the state.`,
            "10-28": `The Old St. Charles Bridge over the Missouri River opened in the spring of 1904 as a private toll and streetcar bridge. It charged tolls until December 1931.`,
            "10-29": `On this day in 2014, Midtown Neighborhood Historic District in St. Charles was listed in the National Register of Historic Places.`,
            "10-30": `On this day in 1875, Missouri adopted its third Constitution which affected counties including St. Charles by removing restrictive “Ironclad Oath” requirements and lifting limitations on former Confederate soldiers.`,
            "10-31": `The Ironclad Oath was a strict loyalty pledge passed by the U.S. Congress in July 1862 that required government workers, military officers, and later lawyers to swear that they had never voluntarily supported the Confederacy.`,
            "11-1": `On this day in 1821, St. Charles officially became the temporary home of the state government and the first capitol of Missouri.`,
            "11-2": `On this day in 2018, Sage Cemetery at 8500 Veterans Memorial Parkway, O’Fallon was listed in the National Register of Historic Places.`,
            "11-3": `The O’Fallon Fire Protection District’s origins go back to the O’Fallon Volunteer Fire Department which was established in 1906. Voters approved formation of the formal fire protection district in November 1970.`,
            "11-4": `On this day in 1836, Flint Hill was officially founded.`,
            "11-5": `On this day in 1961, Fort Osage in Jackson County, MO was placed on the list of National Historic Landmarks. This trading post was established by William Clark in 1808 and Rufus Easton and James Audrain served there.`,
            "11-6": `What became St. Joseph Hospital/Health Center was founded in 1885 in a small, five room health care ministry on Chauncey Street in Charles. It was established by the Sisters of St. Mary and is now known as SSM Health.`,
            "11-7": `As early as August 1, 1790, the area that would become St. Charles was called “Les Petites Côtes.”`,
            "11-8": `The St. Charles County Fair moved to Rotary Park in Wentzville in 1991.`,
            "11-9": `St. Charles Speedway was a ¼ mile dirt oval track in St. Peters which operated from 1956 to 2000.`,
            "11-10": `Territorial Gov. Meriwether Lewis finalized a major revision of a treaty with the Osage Nation impacting the St. Charles District in 1808. It opened up vast lands north of the Missouri River for future American settlement.`,
            "11-11": `On this day in 1870, a five-ton iron column of the St. Charles Railroad Bridge over the Missouri River in St. Charles fell. Nine were killed in this incident. Over 1,000 St. Charles County residents served in the military during World War I. The 1910 census had listed the population of the county as 24,695.`,
            "11-12": `During World War II, the Weldon Spring TNT lines ran around the clock, drawing workers from across the region to meet the wartime demands for explosives.`,
            "11-13": `St. Charles County Regional Airport- Smartt Field began in the early 1940’s when the US Navy bought land from Ruth Neubiser to build an auxiliary training airfield for World War II.`,
            "11-14": `On this day in 1980, Old City Hall/Market Square at 101 S. Main, St. Charles was listed in the National Register of Historic Places. This building is the home of the St. Charles County Historical Society.`,
            "11-15": `St. Charles County Regional Airport was originally called Neubiser Field. It was renamed Smartt Field to honor Ensign Joseph Gillespie Smartt, who was killed at Pearl Harbor.`,
            "11-16": `On this day in 1820, The Missouri Territorial Legislature approved the creation of Boone County, an offshoot closely tied to the regional influence of St. Charles County and Daniel Boone, who had recently died.`,
            "11-17": `On this day in 1796, Joseph Chartrand received a land grant to operate a ferry across the Missouri River near St. Charles. This route evolved into St. Charles Rock Road.`,
            "11-18": `On this day in 1852, Rose Philippine Duchesne died at St. Charles, where she had opened the first free school west of the Mississippi in 1818.`,
            "11-19": `The name Peruque, as in Peruque Creek, means “wig” in French. The creek is a 56-mile stream in Warren and St. Charles Counties that flows into the Mississippi River.`,
            "11-20": `On this day in 1826, after having moved from St. Charles, the Missouri legislature met in Jefferson City for the first time.`,
            "11-21": `On this day in 1980, the African Church/A.M.E. Church of St. Charles at 554 Madison Street was listed in the National Register of Historic Places.`,
            "11-22": `A history of St. Peters relates that in 1891, the city had a population of 500 people and contained a flour mill, Catholic Church, a parochial and a public school and a Western Union Telegraph office.`,
            "11-23": `US Route 61 in St. Charles County evolved from early 19th century dirt trails into a concrete state highway in 1928. It was later transformed into a modern, multi-lane expressway.`,
            "11-24": `The Cuivre River is a 41.6 mile river that marks part of the border between St. Charles and Lincoln Counties before flowing into the Mississippi River.`,
            "11-25": `On this day in 1820, Gov. Alexander McNair signed the bill making St. Charles Missouri’s first state capitol.`,
            "11-26": `In 1816, a group of 12 citizens of St. Charles County petitioned the state to construct a public road running from St. Charles to the Howard County line.`,
            "11-27": `Missouri’s First Constitution was written and approved quickly- in just 38 days. It was finished on July 19, 1820 and 40 men from 15 counties met to produce the document.`,
            "11-28": `Salt River Road was an early 19th-century pioneer transportation route established in St. Charles County to connect St. Charles northward toward the Salt River and Mississippi River regions.`,
            "11-29": `On this day in 1978, Lindenwood Hall on the Lindenwood College, now University, campus was listed in the National Register of Historic Places.`,
            "11-30": `On this day in 1803, Spain formally transferred ownership of the Louisiana Purchase area back to France in New Orleans. France, therefore, owned the territory for 20 days before it transferred the territory to the United States on December 20.`,
            "12-1": `Belleau Creek is a 1.2 mile long stream flowing near the communities of St. Peters and O’Fallon. It was originally named for Jean Baptiste Belland and at some point the spelling was changed to Belleau.`,
            "12-2": `Interstate 64 in St. Charles County began as a two-lane divided highway designated as U.S. Route 40 with at-grade intersections including stop lights. Over the decades, MO Department of Transportation eliminated stoplights, upgraded exits and officially re-signed it as Interstate 64 in 2009.`,
            "12-3": `In 1812, citizens of St. Charles County met and formally resolved that they felt neglected, vulnerable and “miserably forgotten by the general government” regarding frontier defense during the War of 1812.`,
            "12-4": `Jean Baptiste Point DuSable, considered the founder of Chicago, died in St. Charles in 1818.`,
            "12-5": `St. Peters Volunteer Fire Department was founded in 1904. It later incorporated as St. Peters Community Fire Department in 1941 and transitioned to the St. Peters Fire Protection District in 1971. In 1998, it combined with St. Charles Fire Protection District to form Central County Fire and Rescue.`,
            "12-6": `Missouri Route 370 in St. Charles County was built during the late 1980’s and 1990’s as a vital relief valve for congested Interstate 70. The first section was opened in December 1992.`,
            "12-7": `Warren Cottle and his son Ira arrive in what would become Cottleville in 1798. After he received a land grant, he returned to his former home in VT and returned to what would become St. Charles County with 100 people.`,
            "12-8": `U.S. Route 67 through West Alton in northern St. Charles County was routed into the area by the mid-1940’s following the completion of the original Lewis Bridge over the Missouri River in 1927.`,
            "12-9": `DuSable Park in St. Charles is named in honor of Jean Baptiste Point DuSable, a pioneering trader recognized as being the founder of Chicago, who spent his final years living and operating a river ferry in St. Charles. The park was dedicated and opened in 1997.`,
            "12-10": `Etienne Bernard received a land grant for property on the Dardenne on March 7, 1796. His family would be one of the twelve families involved with the founding of All Saints Catholic Church in St. Peters.`,
            "12-11": `Established as one of Missouri’s original state highways in 1921-1922, Missouri Route 94 evolved from early 19th-century dirt paths like Marthasville Road into a vital rural link and eventually a major multi-lane urban arterial.`,
            "12-12": `Mackey Wherry served as the first sheriff of the St. Charles District from 1805 to 1813. The massive district was described as the territory west of the Mississippi River and north of the Missouri River which includes all or a portion of Missouri, Iowa, Minnesota, North Dakota, South Dakota, Montana and a portion of Canada.`,
            "12-13": `In 2021, a destructive EF-3 tornado struck St. Charles County near Defiance damaging over two dozen homes, leveling several structures and killing one person.`,
            "12-14": `On this day in 1818, Montgomery and Lincoln Counties were created from the original territory of St. Charles County.`,
            "12-15": `Missouri’s 1820 constitution had its own Bill of Rights.`,
            "12-16": `On this day in 1811, the first New Madrid earthquake rocked the Mississippi Valley. In St. Charles, chimneys cracked and bells rang.`,
            "12-17": `On this day in 1992, the Discovery Bridge carrying Route 370 traffic over the Missouri River opened to traffic.`,
            "12-18": `Following voter approval of the St. Charles County Home Rule Charter, the responsibility of managing the county jail was transferred from the Sheriff to an appointed Director of the Department of Corrections in 1995.`,
            "12-19": `In the early days of the Academy of the Sacred Heart, paying boarding students were accepted to help support the struggling schools.`,
            "12-20": `On this day in 1803, the United States took formal possession in New Orleans at the Cabildo of the lower Louisiana Territory from the French.`,
            "12-21": `Established in 1874, St. Joseph Catholic Church in Cottleville began as a small community of roughly 35 families.`,
            "12-22": `Cottleville appointed its first City Marshal in July 1986. It became a fourth-class city on January 1, 1993 and appointed their first Police Chief.`,
            "12-23": `Highway 94 in St. Charles County runs from West Alton in the northeast, southwest through St. Charles and St. Peters, and then west along the Missouri River bluffs through Defiance and Augusta.`,
            "12-24": `St. Charles County served as a crucial eastern gateway or pass through point for those who traveled southwest. The Santa Fe Trail was a 1,200-mile historic commercial highway connecting Franklin and Independence, Missouri to Santa Fe, NM. It was active from 1821 until 1880 and was reached via the Boone’s Lick Trail.`,
            "12-25": `Route N followed the path of the 19th-century Boone’s Lick Road and by the 1960’s it was a narrow two- lane state highway.`,
            "12-26": `On this day in 1997, the Environmental Protection Agency started remedial action at the Weldon Spring Former Army Ordnance Works Superfund site.`,
            "12-27": `Hamburg, Howell and Toonerville were three small rural and agricultural communities in St. Charles County whose residents were evacuated and the towns dismantled for the construction of the Weldon Spring Ordnance Works plant in the early 1940’s.`,
            "12-28": `Missouri Route 364, widely known as the Page Extension, is a 21-mile freeway connecting St. Charles County to St. Louis County. Proposed in the 1970’s, it finally opened in 2014.`,
            "12-29": `Nineteenth-century housing in St. Charles County evolved from early French Creole and stone frontier dwellings into Federal-style brick row houses, Greek Revival buildings and late-Victorian folk frame homes.`,
            "12-30": `On this day in 1971, St. Charles County Ambulance District officially began its first day of emergency medical operations.`,
            "12-31": `On this day in 1960, the State of Missouri officially acquired the historic building in St. Charles that had served as the state’s first capitol, preserving it as a landmark.`
        };

        const now = new Date();
        const month = now.getMonth() + 1;
        const day = now.getDate();
        const monthName = now.toLocaleString('default', { month: 'long' });
        const dateKey = `${month}-${day}`;

        document.getElementById('date-header').textContent = `On this day, ${monthName} ${day}, in St. Charles County...`;

        function displayFact() {
            const factEl = document.getElementById('fact');
            const loadingEl = document.getElementById('loading');
            loadingEl.style.display = 'none';

            const entry = STCHARLES_FACTS[dateKey];
            if (entry) {
                factEl.innerHTML = entry;
            } else {
                factEl.innerHTML = `<strong>St. Charles County's fact for today is coming soon!</strong><br>` +
                    `<small>We're still filling in the full 365-day calendar — check back as more local history gets added.</small>`;
            }
        }

        displayFact();
    </script>
